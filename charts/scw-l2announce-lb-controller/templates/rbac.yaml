---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "l2lb.fullname" . }}
  labels:
    {{- include "l2lb.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch, patch]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  # Watches the Cilium L2-announcement leases in kube-system.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch]
  - apiGroups: [cilium.io]
    resources: [ciliumloadbalancerippools]
    verbs: [get, list, watch, create, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "l2lb.fullname" . }}
  labels:
    {{- include "l2lb.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "l2lb.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "l2lb.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if gt (int .Values.replicaCount) 1 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "l2lb.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "l2lb.labels" . | nindent 4 }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "l2lb.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "l2lb.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "l2lb.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "l2lb.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
