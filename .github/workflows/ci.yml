name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Go tests
        run: make test
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: Helm lint
        run: helm lint charts/scw-l2announce-lb-controller
      - name: Chart renders with minimal values
        run: >-
          helm template t charts/scw-l2announce-lb-controller
          --set scaleway.pnID=pn-x --set scaleway.existingSecret=s > /dev/null
      - name: Chart fails without required values
        run: >-
          ! helm template t charts/scw-l2announce-lb-controller > /dev/null 2>&1
      - name: Chart schema rejects unknown keys
        run: >-
          ! helm template t charts/scw-l2announce-lb-controller
          --set scaleway.pnID=pn-x --set scaleway.existingSecret=s
          --set typoKey=1 > /dev/null 2>&1

  image:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No QEMU: the builder stage runs on $BUILDPLATFORM and cross-compiles;
      # the scratch final stage never executes foreign-arch binaries.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - name: Build args
        id: args
        run: |
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TAG=${{ steps.args.outputs.tag }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.args.outputs.build_date }}
          # mode=max: the final image is FROM scratch, so the builder stage
          # (apk, go mod download, compile) is only cached with max mode.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Runs third-party PyPI code, so it is isolated in an unprivileged job:
  # no token permissions, no persisted git credentials. The privileged chart
  # job only consumes the resulting artifact.
  docs:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Generate release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed "s/\${VERSION}/${VERSION}/g" .github/release-notes-preamble.md > body.md
          pipx run jsonschema-markdown==2026.5.0 --no-footer \
            charts/scw-l2announce-lb-controller/values.schema.json >> body.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: body.md

  chart:
    if: github.ref_type == 'tag'
    # The published chart's default image.tag points at this release's image,
    # so the image must exist first.
    needs: [image, docs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
      - name: Package and push chart
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          helm package charts/scw-l2announce-lb-controller \
            --version "$VERSION" --app-version "$VERSION"
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "scw-l2announce-lb-controller-${VERSION}.tgz" \
            "oci://ghcr.io/${{ github.repository_owner }}/charts"
      - name: Create GitHub release with values docs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file body.md \
            "scw-l2announce-lb-controller-${VERSION}.tgz"
